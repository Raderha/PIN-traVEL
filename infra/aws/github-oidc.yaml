AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC provider + deploy role for Pintravel SAM/S3/CloudFront

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub org or user (e.g. my-user)
  GitHubRepo:
    Type: String
    Description: Repository name only (e.g. pintravel)
  Audience:
    Type: String
    Default: sts.amazonaws.com

Resources:
  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - !Ref Audience
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pintravel-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: !Ref Audience
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      Policies:
        - PolicyName: pintravel-sam-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - lambda:*
                  - apigateway:*
                  - execute-api:*
                  - cloudfront:*
                  - s3:*
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - kms:Decrypt
                  - logs:*
                Resource: "*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
